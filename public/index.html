<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1622">
<title>LAN Militia</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1622; overflow: hidden; overscroll-behavior: none; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #eef2f7;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  canvas.mouse { cursor: none; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             background: rgba(8, 12, 20, 0.82); padding: 16px; box-sizing: border-box; }
  #overlay.hidden { display: none; }
  .card { width: min(360px, 100%); background: #172234; border: 1px solid #2a3a52; border-radius: 14px;
          padding: 22px; box-sizing: border-box; text-align: center; }
  h1 { margin: 0 0 16px; font-size: 26px; letter-spacing: 0.5px; }
  input, button { width: 100%; box-sizing: border-box; font: inherit; font-size: 17px; border-radius: 10px; padding: 12px; }
  input { background: #0e1622; color: #eef2f7; border: 1px solid #34465f; margin-bottom: 10px; -webkit-user-select: text; user-select: text; }
  button { background: #f2b63c; color: #1a1408; border: 0; font-weight: 700; cursor: pointer; }
  button:active { transform: translateY(1px); }
  #status { min-height: 20px; margin: 10px 0 0; color: #ffcf73; font-size: 14px; }
  .help { margin: 12px 0 0; font-size: 12.5px; line-height: 1.5; color: #9fb0c6; text-align: left; }
  #rotate { display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
            background: #0e1622; font-size: 20px; text-align: center; padding: 16px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <div class="card">
    <h1>LAN Militia</h1>
    <input id="name" maxlength="12" placeholder="Your name" autocomplete="off" spellcheck="false">
    <button id="play">Play</button>
    <p id="status"></p>
    <p class="help">
      <b>Phone:</b> left thumb moves, push it up to fly. Right thumb aims, push it far to shoot.<br>
      <b>Laptop:</b> A / D move, W or Space flies, mouse aims, click shoots, R reloads.
    </p>
  </div>
</div>
<div id="rotate">Turn your phone sideways to play</div>
<script type="module" src="/client.js"></script>
</body>
</html>
