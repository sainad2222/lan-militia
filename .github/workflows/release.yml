name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package
        run: |
          npm run build
          name="lan-militia-${GITHUB_REF_NAME}"
          mkdir -p "$name/dist" "$name/public"
          cp dist/server.js "$name/dist/"
          cp public/index.html public/client.js "$name/public/"
          cp README.md LICENSE NOTICE CHANGELOG.md "$name/"
          zip -r "$name.zip" "$name"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "lan-militia-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
